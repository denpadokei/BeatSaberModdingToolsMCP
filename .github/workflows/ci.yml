name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          uv pip install -e . --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q
